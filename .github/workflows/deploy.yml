name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Atualiza as pré-visualizações de links das vendas novas a cada 30 minutos
    - cron: '*/30 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Mudança de código: testa no Android, no iPhone, as regras do banco e o código do Pix/fotos/agenda.
  # Roda na imagem oficial do Playwright, que já traz os navegadores (sem instalar nada na hora).
  test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.48.2-jammy
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-audit --no-fund
      - run: npx playwright test
        env:
          HOME: /root
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-dos-testes
          path: playwright-report
          retention-days: 14

  # Publica só se os testes passaram (ou se foi só atualização das prévias, sem mudança de código).
  deploy:
    needs: test
    if: >-
      always() && github.event_name != 'pull_request' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: pages
        uses: actions/configure-pages@v5
      - run: node scripts/build-site.mjs
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
